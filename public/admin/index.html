<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Outback Cartel</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#0f0f13;--surface:#1a1a22;--card:#22222e;--border:#2e2e3a;--text:#e6e6ef;--muted:#8888a0;--hot:#ff5533;--ok:#22c55e;--blue:#3b82f6;--gold:#fbbf24;--radius:10px;font-family:system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);min-height:100vh;padding:0}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:800;margin-bottom:4px}
.sub{font-size:12px;color:var(--muted);margin-bottom:20px}
.login{max-width:360px;margin:80px auto;padding:32px;background:var(--surface);border-radius:14px;text-align:center}
.login h1{font-size:22px;margin-bottom:16px}
.login input{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;margin-bottom:12px}
.login input:focus{outline:none;border-color:var(--blue)}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--hot);color:#fff}
.btn-sm{padding:6px 12px;font-size:11px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.error{color:var(--hot);font-size:12px;margin-bottom:8px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.badge-pending{background:#553300;color:var(--gold)}
.badge-confirmed{background:#1a3a1a;color:var(--ok)}
.badge-processing{background:#1a2a4a;color:var(--blue)}
.badge-dispatched{background:#2a1a4a;color:#a78bfa}
.badge-delivered{background:#0a3a2a;color:#34d399}
.badge-cancelled{background:#3a1a1a;color:#ef4444}
.order-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:12px;overflow:hidden}
.order-header{padding:14px 16px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.order-header:hover{background:var(--card)}
.order-ref{font-weight:800;font-size:14px;font-family:monospace;letter-spacing:.5px}
.order-meta{font-size:11px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.order-body{padding:0 16px 14px;border-top:1px solid var(--border)}
.order-body table{width:100%;border-collapse:collapse;font-size:12px;margin:10px 0}
.order-body th{text-align:left;color:var(--muted);font-weight:600;padding:4px 8px 4px 0;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.order-body td{padding:4px 8px 4px 0}
.cust-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;margin:10px 0}
.cust-grid dt{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.cust-grid dd{margin:0 0 6px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty span{font-size:48px;display:block;margin-bottom:12px}
.loading{text-align:center;padding:40px;color:var(--muted)}
.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.refresh{background:none;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit}
.refresh:hover{color:var(--text);border-color:var(--muted)}
select.filter{background:var(--bg);color:var(--text);border:1px solid var(--border);padding:6px 10px;border-radius:6px;font-size:12px;font-family:inherit}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border)}
.tab{background:none;border:none;color:var(--muted);padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border-bottom:2px solid transparent}
.tab[data-active="true"]{color:var(--text);border-bottom-color:var(--hot)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.stat-card .n{font-size:24px;font-weight:800}
.stat-card .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.an-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px}
.an-section h2{font-size:14px;margin-bottom:10px}
.an-table{width:100%;border-collapse:collapse;font-size:12px}
.an-table th{text-align:left;color:var(--muted);font-weight:600;padding:5px 8px 5px 0;font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
.an-table td{padding:6px 8px 6px 0;border-bottom:1px solid var(--border)}
.an-table tr:last-child td{border-bottom:none}
.daysel{margin-left:auto}
</style>
</head>
<body>

<div id="app"></div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const app = $("app");
  let authenticated = false;
  let adminEmail = "";
  let otpRequested = false;
  let authBusy = false;
  let orders = [];
  let filter = "all";
  let loading = false;
  let error = "";
  let expandedIds = new Set();
  let tab = "orders"; // "orders" | "analytics"
  let analytics = null;
  let analyticsLoading = false;
  let analyticsError = "";
  let analyticsDays = 30;

  const STATUS_LABELS = {
    pending_review: "Pending",
    confirmed: "Confirmed",
    processing: "Processing",
    dispatched: "Dispatched",
    delivered: "Delivered",
    cancelled: "Cancelled",
  };

  const STATUS_ACTIONS = {
    pending_review: [["confirmed","✅ Confirm"],["cancelled","❌ Cancel"]],
    confirmed: [["processing","⚙️ Processing"],["cancelled","❌ Cancel"]],
    processing: [["dispatched","🚚 Dispatch"]],
    dispatched: [["delivered","📦 Delivered"]],
  };

  function fmt(n) { return "৳" + Number(n).toLocaleString("en-BD"); }

  function timeSince(iso) {
    const d = new Date(iso);
    const now = new Date();
    const mins = Math.floor((now - d) / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + "m ago";
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + "h ago";
    const days = Math.floor(hrs / 24);
    if (days < 7) return days + "d ago";
    return d.toLocaleDateString("en-AU",{day:"numeric",month:"short"});
  }

  function headers() { return { "Content-Type": "application/json" }; }
  const esc = value => String(value ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll(String.fromCharCode(39),"&#39;");
  async function authRequest(body) {
    const res = await fetch("/api/admin/auth", { method:"POST", credentials:"same-origin", headers:headers(), body:JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Authentication failed");
    return data;
  }

  async function fetchOrders() {
    loading = true; error = ""; render();
    try {
      const res = await fetch("/api/admin/orders", { headers: headers() });
      if (res.status === 401) { authenticated = false; adminEmail = ""; error = "Your session expired. Sign in again."; loading = false; render(); return; }
      if (!res.ok) { const d = await res.json().catch(()=>({})); throw new Error(d.error || res.status); }
      const data = await res.json();
      orders = data.orders || [];
    } catch(e) { error = e.message; }
    loading = false; render();
  }

  async function fetchAnalytics() {
    analyticsLoading = true; analyticsError = ""; render();
    try {
      const res = await fetch(`/api/admin/analytics?days=${analyticsDays}`, { headers: headers() });
      if (res.status === 401) { authenticated = false; adminEmail = ""; analyticsError = "Your session expired. Sign in again."; analyticsLoading = false; render(); return; }
      if (!res.ok) { const d = await res.json().catch(()=>({})); throw new Error(d.error || res.status); }
      analytics = await res.json();
    } catch(e) { analyticsError = e.message; }
    analyticsLoading = false; render();
  }

  async function updateStatus(orderId, newStatus) {
    try {
      const res = await fetch("/api/admin/orders", {
        method: "POST", headers: headers(),
        body: JSON.stringify({ orderId, newStatus }),
      });
      const data = await res.json().catch(()=>({}));
      if (!res.ok) { alert("Error: " + (data.error || res.status)); return; }
      await fetchOrders();
    } catch(e) { alert("Network error: " + e.message); }
  }

  async function requestCode(email) {
    authBusy = true; error = ""; render();
    try { await authRequest({ action:"request", email }); adminEmail = email.trim().toLowerCase(); otpRequested = true; }
    catch (e) { error = e.message; }
    authBusy = false; render();
  }
  async function verifyCode(email, code) {
    authBusy = true; error = ""; render();
    try {
      const data = await authRequest({ action:"verify", email, token:code });
      authenticated = true; adminEmail = data.email || email.trim().toLowerCase();
      otpRequested = false; orders = []; analytics = null;
      await fetchOrders();
    } catch (e) { error = e.message; }
    authBusy = false; render();
  }
  async function logout() {
    try { await authRequest({ action:"logout" }); } catch { /* clear local UI regardless */ }
    authenticated = false; adminEmail = ""; otpRequested = false; orders = []; analytics = null; render();
  }
  async function checkSession() {
    try {
      const res = await fetch("/api/admin/auth", { credentials:"same-origin", cache:"no-store" });
      const data = await res.json();
      if (res.ok && data.authenticated) { authenticated = true; adminEmail = data.email; await fetchOrders(); return; }
    } catch { /* show sign-in form */ }
    authenticated = false; render();
  }

  function toggleExpand(id) {
    if (expandedIds.has(id)) expandedIds.delete(id); else expandedIds.add(id);
    render();
  }

  function renderLogin() {
    app.innerHTML = `
      <div class="login">
        <h1>🔒 Admin</h1>
        <p style="color:var(--muted);font-size:13px;margin-bottom:16px">Outback Cartel order management</p>
        ${error ? `<div class="error">${esc(error)}</div>` : ""}
        ${otpRequested ? `
          <p style="color:var(--muted);font-size:12px;margin-bottom:12px">Enter the six-digit code sent to ${esc(adminEmail)}.</p>
          <form id="verifyForm">
            <input type="text" id="otpInput" placeholder="6-digit email code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
            <button type="submit" class="btn btn-primary" style="width:100%" ${authBusy?"disabled":""}>${authBusy?"Verifying…":"Verify and sign in"}</button>
          </form>
          <button class="refresh" id="backBtn" style="margin-top:12px">Use another email</button>
        ` : `
          <p style="color:var(--muted);font-size:12px;margin-bottom:12px">Sign in with an authorised admin email. We'll send you a one-time code.</p>
          <form id="loginForm">
            <input type="email" id="emailInput" placeholder="Admin email address" autocomplete="email" required maxlength="254">
            <button type="submit" class="btn btn-primary" style="width:100%" ${authBusy?"disabled":""}>${authBusy?"Sending…":"Send sign-in code"}</button>
          </form>
        `}
      </div>`;
    if (otpRequested) {
      $("verifyForm").onsubmit = e => { e.preventDefault(); verifyCode(adminEmail, $("otpInput").value); };
      $("backBtn").onclick = () => { otpRequested = false; error = ""; render(); };
      $("otpInput").focus();
    } else {
      $("loginForm").onsubmit = e => { e.preventDefault(); requestCode($("emailInput").value); };
      $("emailInput").focus();
    }
  }

  function tabsHtml() {
    return `<div class="tabs">
      <button class="tab" data-tab="orders" data-active="${tab==="orders"}">📦 Orders</button>
      <button class="tab" data-tab="analytics" data-active="${tab==="analytics"}">📊 Analytics</button>
    </div>`;
  }

  function fmtCompact(n) { return Number(n).toLocaleString("en-US"); }

  function renderAnalytics() {
    let html = `<div class="wrap">
      <div class="topbar">
        <div><h1>📊 Analytics</h1><div class="sub">Page views, add-to-carts and WhatsApp clicks — zero PII, from oc_events</div></div>
        <div style="display:flex;gap:8px;align-items:center">
          <select class="filter daysel" id="daysFilter">
            ${[7,14,30,60,90].map(d=>`<option value="${d}" ${analyticsDays===d?"selected":""}>Last ${d} days</option>`).join("")}
          </select>
          <button class="refresh" id="analyticsRefreshBtn">↻ Refresh</button>
          <button class="refresh" id="logoutBtn2" style="color:var(--hot)">Logout</button>
        </div>
      </div>`;
    html += tabsHtml();

    if (analyticsLoading) {
      html += `<div class="loading">Loading analytics…</div>`;
    } else if (analyticsError) {
      html += `<div class="error" style="text-align:center;padding:20px">${analyticsError}</div>`;
    } else if (analytics) {
      const t = analytics.totals || {};
      html += `<div class="stat-grid">
        <div class="stat-card"><div class="n">${fmtCompact(t.page_view||0)}</div><div class="l">Page views</div></div>
        <div class="stat-card"><div class="n">${fmtCompact(t.add_to_cart||0)}</div><div class="l">Add to carts</div></div>
        <div class="stat-card"><div class="n">${fmtCompact(t.whatsapp_click||0)}</div><div class="l">WhatsApp clicks</div></div>
      </div>`;

      html += `<div class="an-section"><h2>Campaigns (by UTM source/campaign)</h2>`;
      if (!analytics.campaigns || !analytics.campaigns.length) {
        html += `<div class="empty" style="padding:20px"><span>🔗</span>No tagged traffic yet in this window — add ?utm_source=...&utm_campaign=... to a link to track it.</div>`;
      } else {
        html += `<table class="an-table"><thead><tr><th>Source</th><th>Campaign</th><th>Page views</th><th>Add to carts</th><th>WhatsApp clicks</th></tr></thead><tbody>`;
        for (const c of analytics.campaigns) {
          html += `<tr><td>${esc(c.source)}</td><td>${esc(c.campaign)}</td><td>${fmtCompact(c.page_view)}</td><td>${fmtCompact(c.add_to_cart)}</td><td>${fmtCompact(c.whatsapp_click)}</td></tr>`;
        }
        html += `</tbody></table>`;
      }
      html += `</div>`;

      html += `<div class="an-section"><h2>Most added to cart</h2>`;
      if (!analytics.products || !analytics.products.length) {
        html += `<div class="empty" style="padding:20px"><span>🛒</span>No add-to-cart events in this window</div>`;
      } else {
        html += `<table class="an-table"><thead><tr><th>Product</th><th>Add to carts</th></tr></thead><tbody>`;
        for (const p of analytics.products) {
          html += `<tr><td>${esc(p.name)}</td><td>${fmtCompact(p.add_to_cart)}</td></tr>`;
        }
        html += `</tbody></table>`;
      }
      html += `</div>`;

      if (analytics.dailySeries && analytics.dailySeries.length) {
        html += `<div class="an-section"><h2>By day</h2><table class="an-table"><thead><tr><th>Date</th><th>Page views</th><th>Add to carts</th></tr></thead><tbody>`;
        for (const d of [...analytics.dailySeries].reverse()) {
          html += `<tr><td>${esc(d.day)}</td><td>${fmtCompact(d.page_view)}</td><td>${fmtCompact(d.add_to_cart)}</td></tr>`;
        }
        html += `</tbody></table></div>`;
      }

      if (analytics.truncated) {
        html += `<div class="sub">Showing the most recent ${fmtCompact(analytics.sampledRows)} events in this window — older ones in the window aren't counted. Narrow the date range for a complete count.</div>`;
      }
    }
    html += `</div>`;
    app.innerHTML = html;

    $("analyticsRefreshBtn")?.addEventListener("click", fetchAnalytics);
    $("logoutBtn2")?.addEventListener("click", logout);
    $("daysFilter")?.addEventListener("change", e => { analyticsDays = Number(e.target.value); fetchAnalytics(); });
    document.querySelectorAll("[data-tab]").forEach(el => {
      el.addEventListener("click", () => { tab = el.dataset.tab; if (tab === "analytics" && !analytics) fetchAnalytics(); render(); });
    });
  }

  function renderOrders() {
    const filtered = filter === "all" ? orders : orders.filter(o => o.status === filter);
    const counts = {};
    for (const o of orders) counts[o.status] = (counts[o.status]||0) + 1;

    let html = `<div class="wrap">
      <div class="topbar">
        <div><h1>📦 Orders</h1><div class="sub">${orders.length} total</div></div>
        <div style="display:flex;gap:8px;align-items:center">
          <select class="filter" id="statusFilter">
            <option value="all">All (${orders.length})</option>
            ${Object.entries(STATUS_LABELS).map(([k,v])=>`<option value="${k}" ${filter===k?"selected":""}>${v} (${counts[k]||0})</option>`).join("")}
          </select>
          <button class="refresh" id="refreshBtn">↻ Refresh</button>
          <button class="refresh" id="logoutBtn" style="color:var(--hot)">Logout</button>
        </div>
      </div>`;
    html += tabsHtml();

    if (loading) {
      html += `<div class="loading">Loading orders…</div>`;
    } else if (error) {
      html += `<div class="error" style="text-align:center;padding:20px">${error}</div>`;
    } else if (filtered.length === 0) {
      html += `<div class="empty"><span>📭</span>No orders${filter!=="all"?" with this status":""} yet</div>`;
    } else {
      for (const o of filtered) {
        const expanded = expandedIds.has(o.id);
        const badge = `badge-${o.status.replace("pending_review","pending")}`;
        html += `<div class="order-card">
          <div class="order-header" data-toggle="${esc(o.id)}">
            <div style="display:flex;align-items:center;gap:10px">
              <span class="order-ref">${esc(o.public_reference)}</span>
              <span class="badge ${badge}">${STATUS_LABELS[o.status]||o.status}</span>
            </div>
            <div class="order-meta">
              <span>${fmt(o.total_bdt)}</span>
              <span>${esc(o.customer_name)}</span>
              <span>${timeSince(o.created_at)}</span>
              <span>${expanded?"▲":"▼"}</span>
            </div>
          </div>`;
        if (expanded) {
          html += `<div class="order-body">
            <dl class="cust-grid">
              <dt>Customer</dt><dd>${esc(o.customer_name)}</dd>
              <dt>Phone</dt><dd>${esc(o.phone)}</dd>
              <dt>District</dt><dd>${esc(o.district)}${o.area?", "+o.area:""}</dd>
              <dt>Address</dt><dd>${esc(o.address)}</dd>
              <dt>Zone</dt><dd>${esc(o.delivery_zone)}</dd>
              <dt>Payment</dt><dd>${esc(o.payment_method).toUpperCase()}</dd>
            </dl>
            <table>
              <thead><tr><th>Product</th><th>Variant</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead>
              <tbody>
                ${(o.items||[]).map(i=>{
                  const vs = i.variant_snapshot||{};
                  const vt = [vs.size,vs.colour].filter(Boolean).join(", ")||"—";
                  return `<tr><td>${esc(i.product_title_snapshot)}</td><td>${esc(vt)}</td><td>${i.quantity}</td><td>${fmt(i.unit_price_bdt)}</td><td>${fmt(i.line_total_bdt)}</td></tr>`;
                }).join("")}
              </tbody>
              <tfoot>
                <tr><td colspan="4" style="text-align:right;font-weight:700">Subtotal</td><td>${fmt(o.subtotal_bdt)}</td></tr>
                <tr><td colspan="4" style="text-align:right;font-weight:700">Delivery</td><td>${fmt(o.delivery_bdt)}</td></tr>
                <tr><td colspan="4" style="text-align:right;font-weight:800;font-size:14px">Total</td><td style="font-weight:800;font-size:14px">${fmt(o.total_bdt)}</td></tr>
              </tfoot>
            </table>
            ${(STATUS_ACTIONS[o.status]||[]).length ? `<div class="actions">${(STATUS_ACTIONS[o.status]||[]).map(([s,l])=>`<button class="btn btn-sm btn-primary" data-action="${esc(o.id)}:${s}">${l}</button>`).join("")}</div>` : ""}
          </div>`;
        }
        html += `</div>`;
      }
    }
    html += `</div>`;
    app.innerHTML = html;

    // Event listeners
    $("refreshBtn")?.addEventListener("click", fetchOrders);
    $("logoutBtn")?.addEventListener("click", logout);
    $("statusFilter")?.addEventListener("change", e => { filter = e.target.value; render(); });
    document.querySelectorAll("[data-tab]").forEach(el => {
      el.addEventListener("click", () => { tab = el.dataset.tab; if (tab === "analytics" && !analytics) fetchAnalytics(); render(); });
    });
    document.querySelectorAll("[data-toggle]").forEach(el => {
      el.addEventListener("click", () => toggleExpand(el.dataset.toggle));
    });
    document.querySelectorAll("[data-action]").forEach(el => {
      el.addEventListener("click", e => {
        e.stopPropagation();
        const [id, status] = el.dataset.action.split(":");
        if (confirm(`Change status to "${STATUS_LABELS[status]||status}"?`)) updateStatus(id, status);
      });
    });
  }

  function render() {
    if (!authenticated) { renderLogin(); return; }
    if (tab === "analytics") renderAnalytics(); else renderOrders();
  }

  render();
  checkSession();
})();
</script>
</body>
</html>
